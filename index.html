<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Point Store | Advertising & Gift Store</title>
  
  <!-- خط Cairo الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة الأيقونات Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #fbfbfd;
      --point-purple: #341553;
      --point-orange: #ff5e15;
      --card-bg: #ffffff;
      --card-border: #edebe9;
      --text-dark: #1a1a1a;
      --text-muted: #707070;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 30px;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* رأس الصفحة وهوية point الكلاسيكية */
    .brand-card {
      text-align: center;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* حاوية اللوجو الدائرية بإطار كلاسيكي أنيق */
    .logo-container {
      width: 130px;
      height: 130px;
      background: #ffffff;
      border: 3px solid var(--point-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 10px 30px rgba(52, 21, 83, 0.12);
      overflow: hidden;
      padding: 12px;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.02);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* صندوق المتابعة الكلاسيكي البارز في الأعلى (عربي و إنجليزي) */
    .top-follow-section {
      text-align: center;
      margin-bottom: 22px;
      width: 100%;
      max-width: 420px;
      padding: 18px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .top-follow-title {
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--point-orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .top-brand-main {
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 21px;
      font-weight: 900;
      color: var(--point-purple);
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .top-brand-sub {
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* حاوية الروابط */
    .links-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* صف الأزرار السريعة: واتساب + اتصال */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-quick {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .btn-quick:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      border-color: #dcdcdc;
    }

    .btn-quick.whatsapp i { color: #25D366; font-size: 20px; }
    .btn-quick.call i { color: var(--point-orange); font-size: 18px; }

    /* أزرار القائمة الكاملة */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .link-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      border-color: #dcdcdc;
    }

    .row-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .row-content i {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .chevron {
      font-size: 11px;
      color: #ccc;
    }

    /* ألوان الأيقونات الاحترافية */
    .btn-website i { color: var(--point-purple); }
    .btn-whatsapp i { color: #25D366; }
    .btn-facebook i { color: #1877F2; }
    .btn-instagram i { color: #E1306C; }
    .btn-maps i { color: var(--point-orange); }

    .footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- قسم اللوجو والبراند الرسمي -->
  <div class="brand-card">
    <div class="logo-container">
      <img src="POINT LOGO0.png" alt="Point Store Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/341553/ffffff?text=point.';">
    </div>
  </div>

  <!-- صندوق المتابعة الكلاسيكي البارز في الأعلى (عربي وإنجليزي) -->
  <div class="top-follow-section">
    <div class="top-follow-title">✨ تابعنا • Follow Us ✨</div>
    <div class="top-brand-main">Point Store</div>
    <div class="top-brand-sub">Your Brand’s Turning Point</div>
  </div>

  <!-- قائمة الروابط بالترتيب المطلوب -->
  <div class="links-wrapper">

    <!-- 1. أزرار التواصل المباشر -->
    <div class="quick-row">
      <a href="https://wa.me/201556712331" class="btn-quick whatsapp" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        <span>واتساب</span>
      </a>

      <a href="tel:01556712331" class="btn-quick call">
        <i class="fa-solid fa-phone"></i>
        <span>اتصال</span>
      </a>
    </div>

    <!-- 2. صفحة فيسبوك -->
    <a href="https://www.facebook.com/profile.php?id=61578371426405" class="link-row btn-facebook" target="_blank">
      <div class="row-content">
        <i class="fa-brands fa-facebook-f"></i>
        <span>Point Store</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 3. حساب إنستغرام -->
    <a href="https://www.instagram.com/stories/point_store.eg/" class="link-row btn-instagram" target="_blank">
      <div class="row-content">
        <i class="fa-brands fa-instagram"></i>
        <span>point-store.eg</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 4. موقع المؤسسة (GPS) -->
    <a href="https://maps.app.goo.gl/onkFQgFsgNDiwV6D8" class="link-row btn-maps" target="_blank">
      <div class="row-content">
        <i class="fa-solid fa-location-dot"></i>
        <span>موقع المؤسسة</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 5. زيارة الموقع الرسمي للمتجر -->
    <a href="https://point-store.com/" class="link-row btn-website" target="_blank">
      <div class="row-content">
        <i class="fa-solid fa-globe"></i>
        <span>زيارة المتجر الإلكتروني</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

  </div>

  <div class="footer">
    © 2026 Point Store — جميع الحقوق محفوظة
  </div>

</body>
</html>
