<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Point Store | Advertising & Gift Store</title>
  
  <!-- خط Cairo الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة الأيقونات Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #f8f9fa;
      --point-purple: #341553;
      --point-orange: #ff5e15;
      --card-bg: #ffffff;
      --card-border: #eaeaea;
      --text-dark: #222222;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 20px;
    }

    /* رأس الصفحة وهوية point */
    .brand-card {
      text-align: center;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* حاوية اللوجو الدائرية */
    .logo-container {
      width: 120px;
      height: 120px;
      background: #ffffff;
      border: 2px solid #f0f0f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(52, 21, 83, 0.08);
      overflow: hidden;
      padding: 12px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--point-purple);
      line-height: 1;
      margin-bottom: 4px;
    }

    .brand-title span {
      color: var(--point-orange);
    }

    .brand-subtitle {
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--point-purple);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* حاوية الروابط */
    .links-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* صف الأزرار السريعة: واتساب + اتصال */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-quick {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 12px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
    }

    .btn-quick:active, .btn-quick:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      border-color: #ddd;
    }

    .btn-quick.whatsapp i {
      color: #25D366;
      font-size: 22px;
    }

    .btn-quick.call i {
      color: var(--point-orange);
      font-size: 20px;
    }

    /* أزرار القائمة الكاملة */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
    }

    .link-row:active, .link-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      border-color: #ddd;
    }

    .row-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .row-content i {
      font-size: 20px;
      width: 26px;
      text-align: center;
    }

    .chevron {
      font-size: 12px;
      color: #aaa;
    }

    /* ألوان الأيقونات */
    .btn-website i { color: var(--point-purple); }
    .btn-whatsapp i { color: #25D366; }
    .btn-facebook i { color: #1877F2; }
    .btn-instagram i { color: #E1306C; }
    .btn-maps i { color: #EA4335; }

    /* نبذة عن الخدمات المستخرجة من الموقع */
    .services-badge {

      border: 1px dashed rgba(255, 94, 21, 0.3);
      border-
