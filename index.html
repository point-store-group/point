<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Point Store | Advertising & Gift Store</title>
  
  <!-- خط Cairo الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة الأيقونات Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #f8f9fa;
      --point-purple: #341553;
      --point-orange: #ff5e15;
      --card-bg: #ffffff;
      --card-border: #eaeaea;
      --text-dark: #222222;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 16px 20px;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* رأس الصفحة وهوية point */
    .brand-card {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* حاوية اللوجو الدائرية مع إطار بنفسجي متناسق */
    .logo-container {
      width: 125px;
      height: 125px;
      background: #ffffff;
      border: 3.5px solid var(--point-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 8px 25px rgba(52, 21, 83, 0.15);
      overflow: hidden;
      padding: 10px;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* حاوية الروابط */
    .links-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* صف الأزرار السريعة: واتساب + اتصال */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-quick {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .btn-quick:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      border-color: #dcdcdc;
    }

    .btn-quick.whatsapp i { color: #25D366; font-size: 20px; }
    .btn-quick.call i { color: var(--point-orange); font-size: 18px; }

    /* أزرار القائمة الكاملة */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .link-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      border-color: #dcdcdc;
    }

    .row-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .row-content i {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .chevron {
      font-size: 11px;
      color: #bbb;
    }

    /* ألوان الأيقونات */
    .btn-website i { color: var(--point-purple); }
    .btn-whatsapp i { color: #25D366; }
    .btn-facebook i { color: #1877F2; }
    .btn-instagram i { color: #E1306C; }
    .btn-maps i { color: #EA4335; }

    /* نبذة عن الخدمات */
    .services-badge {
      background: rgba(255, 94, 21, 0.04);
      border: 1px dashed rgba(255, 94, 21, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      font-size: 12.5px;
      color: #b53e00;
      line-height: 1.6;
      margin-top: 4px;
      font-weight: 700;
    }

    .footer {
      margin-top: auto;
      padding-top: 25px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- قسم اللوجو والبراند الرسمي -->
  <div class="brand-card">
    <div class="logo-container">
      <img src="POINT LOGO0.png" alt="Point Store Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/341553/ffffff?text=point.';">
    </div>
  </div>

  <!-- قائمة الروابط -->
  <div class="links-wrapper">

    <!-- 1. أزرار التواصل المباشر -->
    <div class="quick-row">
      <a href="https://wa.me/201556712331" class="btn-quick whatsapp" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        <span>واتساب</span>
      </a>

      <a href="tel:01556712331" class="btn-quick call">
        <i class="fa-solid fa-phone"></i>
        <span>اتصال</span>
      </a>
    </div>

    <!-- 2. زيارة الموقع الرسمي للمتجر -->
    <a href="https://point-store.com/" class="link-row btn-website" target="_blank">
      <div class="row-content">
        <i class="fa-solid fa-globe"></i>
        <span>زيارة المتجر الإلكتروني</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 3. صفحة فيسبوك -->
    <a href="https://www.facebook.com/profile.php?id=61578371426405" class="link-row btn-facebook" target="_blank">
      <div class="row-content">
        <i class="fa-brands fa-facebook-f"></i>
        <span>point.</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 4. حساب إنستغرام -->
    <a href="https://www.instagram.com/stories/point_store.eg/" class="link-row btn-instagram" target="_blank">
      <div class="row-content">
        <i class="fa-brands fa-instagram"></i>
        <span>point.</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- 5. موقع المعرض على الخريطة -->
    <a href="https://maps.google.com" class="link-row btn-maps" target="_blank">
      <div class="row-content">
        <i class="fa-solid fa-location-dot"></i>
        <span>موقع المعرض (المنصورة)</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron"></i>
    </a>

    <!-- خدمات المتجر -->
    <div class="services-badge">
      ✨ طباعة بجميع أنواعها • دروع التكريم • ورقيات الشركات • الحفر والطباعة على الخامات • تصميمات احترافية
    </div>

  </div>

  <div class="footer">
    © 2026 Point Store — جميع الحقوق محفوظة
  </div>

</body>
</html>
