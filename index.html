<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Point Store | Advertising & Gift Store</title>
  
  <!-- خط Cairo الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة الأيقونات Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #f8f9fa;
      --point-purple: #341553;
      --point-orange: #ff5e15;
      --card-bg: #ffffff;
      --card-border: #eaeaea;
      --text-dark: #222222;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 20px;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* رأس الصفحة وهوية point */
    .brand-card {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* حاوية اللوجو الدائرية مع إطار بنفسجي أنيق */
    .logo-container {
      width: 125px;
      height: 125px;
      background: #ffffff;
      border: 3.5px solid var(--point-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(52, 21, 83, 0.15);
      overflow: hidden;
      padding: 10px;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* شارة حالة العمل / الموقع */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef9f2;
      color: #1f8a4c;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 5px;
      border: 1px solid rgba(31, 138, 76, 0.15);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #27ae60;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(39, 174, 96, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
    }

    /* حاوية الروابط */
    .links-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    /* صف الأزرار السريعة: واتساب + اتصال */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-quick {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .btn-quick:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      border-color: #dcdcdc;
    }

    .btn-quick.whatsapp i { color: #25D366; font-size: 20px; }
    .btn-quick.call i { color: var(--point-orange); font-size: 18px; }
